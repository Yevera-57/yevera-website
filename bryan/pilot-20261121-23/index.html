<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>bryan｜三日星宿精讀與農民曆｜Yevera</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#090a0e;color:#f2f0ed;font:16px/1.75 system-ui,"Noto Sans TC",sans-serif}main{max-width:640px;margin:auto;padding:20px 16px 70px}h1{font-size:24px;line-height:1.45}h2{font-size:21px;line-height:1.4}h3{font-size:17px;margin:15px 0 8px}p{overflow-wrap:anywhere}.muted,.note{color:#bcbec9}.note{font-size:13px}.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:20px 0}.tabs button{min-width:0;padding:10px 1px;border:1px solid #454650;border-radius:10px;background:#22232b;color:#dedee4;font-size:clamp(12px,3.3vw,15px)}.tabs button[aria-selected=true]{background:#53463c;border-color:#c5a778;color:#fff;font-weight:700}.day{display:none}.day.active{display:block}.card{background:#14151b;border:1px solid #3c3d47;border-radius:17px;padding:14px;margin:15px 0}.deep{line-height:1.9}.deep p{margin:9px 0 14px}.timeline{position:relative;margin:18px 0 0 62px;border-left:3px solid #778393}.segment{position:relative;padding:10px 4px 20px 16px;margin:0;min-height:0;overflow:visible}.segment+.segment{border-top:1px solid #292b34}.segment .when{position:absolute;left:-69px;top:10px;width:53px;text-align:right;font-size:12px;color:#c4c6ce;font-variant-numeric:tabular-nums}.segment .dot{position:absolute;left:-7px;top:18px;width:11px;height:11px;border-radius:50%}.segment strong{display:block;font-size:15px;line-height:1.5;overflow-wrap:anywhere}.segment .location{color:#aeb7c5;font-size:12px;margin:2px 0 8px}.segment p{font-size:13px;line-height:1.65;margin:7px 0;overflow-wrap:anywhere}.segment .activity{background:#252630;border-radius:8px;padding:7px 9px;margin-top:8px}.segment.active{background:#22232b;border-radius:0 12px 12px 0}.now{position:absolute;z-index:5;left:-17px;width:32px;height:32px;border-radius:50%;display:none;align-items:center;justify-content:center;background:#e9c680;color:#161616;box-shadow:0 0 0 3px #6b5539}.bar{display:flex;height:25px;overflow:hidden;border-radius:8px;margin:12px 0 3px}.bar span{display:block;height:100%}.ruler{display:flex;justify-content:space-between;font-size:11px;color:#afb2bf}.buttons{display:flex;gap:7px;flex-wrap:wrap}.buttons button{border:1px solid #60616c;background:#2a2c34;color:white;border-radius:10px;padding:8px 11px;font-size:13px}.clock{font-size:13px;color:#d4d2cc}.foot{font-size:12px;color:#afb1bb}a{color:#e7ce9c}.three-head{font-size:17px;font-weight:700;margin:0 0 12px}.three-scroll{overflow-x:auto;overscroll-behavior-x:contain;padding-bottom:7px}.three-canvas{min-width:680px;position:relative}.three-boundary{display:flex;justify-content:space-between;align-items:flex-start;font-size:13px;color:#e9e6e2;min-height:62px}.three-boundary span{display:block;color:#a5a8b5;font-size:11px;line-height:1.4}.three-track{position:relative;display:flex;height:75px;border-radius:9px;overflow:hidden;margin:8px 0}.three-part{position:relative;min-width:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:5px 3px;border-right:1px solid #b0a4b1;font-size:14px;font-weight:650;line-height:1.5}.three-part small{display:block;font-size:11px;font-weight:400;color:#f0ebf4}.three-lower{position:relative;height:72px}.three-bound{position:absolute;top:0;transform:translateX(-50%);font-size:11px;color:#b5b7c4;white-space:nowrap}.three-bound:before{content:"";display:block;height:10px;width:1px;background:#b6b2c0;margin:0 auto 2px}.three-bound.edge{transform:none}.three-nava{position:relative;margin-top:4px;font-size:12px;display:flex;gap:5px;flex-wrap:wrap}.three-nava b{font-size:12px}.three-nava span{padding:3px 6px;border-radius:7px;background:#252733}.three-legend{font-size:12px;color:#b8bac7;margin:9px 0 0}.three-no-trigger{font-size:12px;color:#d1c1a0}.three-today{font-size:12px;color:#c2c4cf;margin:0 0 8px}</style></head><body><main><p class="muted">Yevera · bryan｜星宿精讀</p><h1>三日逐日星宿運勢</h1><p class="muted">2026/11/21–11/24｜台灣時間｜每日精讀＋星宿／Pada時間軸</p><div id="threeDayGraphic" class="card" aria-label="三日星宿與雙起算九星宿圖"></div><div class="tabs" role="tablist" id="tabs"></div><div id="days"></div><p class="foot">星宿與農民曆為研究性解讀，不能單獨作為投資、醫療或契約決策依據。部分時間尚待獨立星曆複核。</p><p><a href="../">返回原運勢頁</a></p></main><script>"use strict";const days=[{"date":"2026-11-21","label":"11/21（六）","theme":"合作界線與共同資源","intro":"月亮全天位於雙魚座本命第八宮，09:19由Uttarabhādrapadā轉入Revatī。Uttarabhādrapadā由土星主宰，與Ahirbudhnya、深層承擔和持續整合相關；Revatī由水星主宰，守護神Pūṣan涉及引導、護送與完成過渡。換宿不等於換宮。","prediction":"本命上升宿Pūrvaphalgunī起算：Uttarabhādrapadā為Naidhana（考驗）、Revatī為Mitra（友好）；本命月宿Punarvasu起算：前者Sampat（資源）、後者Vipat（障礙）。雙起算不等於吉凶保證，重點是合作成本與共享資源的透明度。觀察條件、款項及責任分工是否需要重談。","almanac":"整理帳務、核對資料、清點合作條件；重大簽約不以單一星宿判吉。","five":"星期六｜日出06:16 日落17:10｜Śukla Ekādaśī｜Uttarabhādrapadā P4｜Vajra｜Viṣṭi","segments":[[0,205,"Uttarabhādrapadā","P3","雙魚 · D1第8宮","合作界線與既有承諾","整理合作事項"],[205,559,"Uttarabhādrapadā","P4","雙魚 · D1第8宮","檢查條件、責任與合作關係","核對文件及待回覆事項"],[559,909,"Revatī","P1","雙魚 · D1第8宮","09:19後觀察共同資源與責任議題","整理帳務與合作條件"],[909,1257,"Revatī","P2","雙魚 · D1第8宮","追蹤資金、經費或協作分工","確認數字、紀錄條件"],[1257,1440,"Revatī","P3","雙魚 · D1第8宮","評估承諾的可持續性","檢查隔日待辦"]]},{"date":"2026-11-22","label":"11/22（日）","theme":"工作成果、合作資源與新方向","intro":"月亮在雙魚第八宮的Revatī（水星／Pūṣan）完成舊有資源議題，上午約08:30進入白羊第九宮Aśvinī（計都／Aśvinī Kumāra雙醫神），從條件核對轉向專業方向與行動起步。07:27左右月亮合本命金星AK是待獨立核實的候選觸發，並非已驗收⭐。","prediction":"雙九星宿：Revatī對上升宿為Mitra、對月宿為Vipat；Aśvinī對上升宿為Parama Mitra、對月宿為Kṣema。觀察工作成果、合作報酬、資源分配和下一步專業計畫是否形成具體討論。","almanac":"清晨整理合作資料；換宿後可規劃會談或下一步，但正式簽署需完整擇時。","five":"星期日｜日出06:17 日落17:09｜Śukla Dvādaśī｜Revatī P4｜Vyatīpāta｜Bālava","segments":[[0,161,"Revatī","P3","雙魚 · D1第8宮","合作與共同資源的收尾","整理帳務及契約資料"],[161,510,"Revatī","P4","雙魚 · D1第8宮","07:27月亮合本命金星AK（待獨立核實）","核對工作經費、成本與責任"],[510,842,"Aśvinī","P1","白羊 · D1第9宮","08:30後思考新方案與專業方向","規劃下一步、草擬提案"],[842,1178,"Aśvinī","P2","白羊 · D1第9宮","觀察專業溝通與方案推進","聯絡、確認流程"],[1178,1440,"Aśvinī","P3","白羊 · D1第9宮","評估新方向是否具體可行","整理明日會談重點"]]},{"date":"2026-11-23","label":"11/23（一）","theme":"制度、責任與長期方案","intro":"月亮全日在白羊第九宮，清晨由Aśvinī（計都／雙醫神，啟動）進入Bharaṇī（金星／Yama，承擔與界線）。第九宮涉及制度、專業判斷、長期規劃與原則。","prediction":"雙九星宿：Aśvinī對上升宿為Parama Mitra、對月宿為Kṣema；Bharaṇī對上升宿為Janma、對月宿為Pratyak（阻礙）。觀察制度要求、期限、預算與執行責任是否需要重新協商。","almanac":"適合做方案比較、權責清單及預算檢查；正式承諾仍須另核活動地點與完整Muhūrta。","five":"星期一｜日出06:18 日落17:09｜Śukla Caturdaśī｜Aśvinī P4｜Variyāna｜Gara","segments":[[0,72,"Aśvinī","P3","白羊 · D1第9宮","延續前一天的工作方向","整理初步提案"],[72,404,"Aśvinī","P4","白羊 · D1第9宮","檢查專業意見與行動準備","會談準備、資料確認"],[404,733,"Bharaṇī","P1","白羊 · D1第9宮","06:44後轉向責任與實際代價","列出權責與條件"],[733,1061,"Bharaṇī","P2","白羊 · D1第9宮","比較成本、制度限制及收益","方案審核、預算評估"],[1061,1386,"Bharaṇī","P3","白羊 · D1第9宮","觀察承諾與執行責任","確認期限、分工"],[1386,1440,"Bharaṇī","P4","白羊 · D1第9宮","整理未決事項","準備後續跟進"]]},{"date":"2026-11-24","label":"11/24（二）","theme":"方案落地與資源配置","intro":"月亮在白羊第九宮Bharaṇī後轉Kṛttikā（金星／Yama轉太陽／Agni），約09:52進入金牛第十宮。第九宮的制度與原則逐漸轉為第十宮的工作執行與成果呈現。","prediction":"雙九星宿：Bharaṇī對上升宿為Janma、對月宿為Pratyak；Kṛttikā對上升宿為Sampat、對月宿為Sādhaka。觀察會談結論是否轉成工作分工、時間表與交付成果。","almanac":"適合檢查議程、任務分工及工作文件；重大承諾仍須另核地方性擇時。","five":"星期二｜日出約06:19｜Pūrṇimā｜Kṛttikā P1｜Parigha｜Viṣṭi（均為待核算）","segments":[[0,270,"Bharaṇī","P4","白羊 · D1第9宮","延續前一日責任議題","整理會談資料"],[270,592,"Kṛttikā","P1","白羊 · D1第9宮","04:30換宿；釐清方案與標準","準備工作分工"],[592,914,"Kṛttikā","P2","金牛 · D1第10宮","09:52轉第十宮，觀察執行成果","確認交付責任"],[914,1234,"Kṛttikā","P3","金牛 · D1第10宮","工作安排與流程修正","追蹤任務進度"],[1234,1440,"Kṛttikā","P4","金牛 · D1第10宮","核對結果與資源配置","整理次日待辦"]]}];const fmt=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");const tabs=document.getElementById("tabs"),root=document.getElementById("days");let selected=0;
function nowTW(){const p=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Taipei",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date());const x=Object.fromEntries(p.map(t=>[t.type,t.value]));return {date:x.year+"-"+x.month+"-"+x.day,m:Number(x.hour)*60+Number(x.minute)}}
const trip=[{id:26,sa:"Uttarabhādrapadā",zh:"後跋陀羅宿",start:0,end:559,shade:"#655aa0",asc:"7 Naidhana 考驗",moon:"2 Sampat 資源"},{id:27,sa:"Revatī",zh:"雷瓦蒂宿",start:559,end:1943,shade:"#258c87",asc:"8 Mitra 友好",moon:"3 Vipat 障礙"},{id:1,sa:"Aśvinī",zh:"雙馬宿",start:1943,end:3283,shade:"#a2647e",asc:"9 Parama Mitra 極友",moon:"4 Kṣema 安穩"},{id:2,sa:"Bharaṇī",zh:"婆羅尼宿",start:3283,end:4320,shade:"#777b9b",asc:"1 Janma 本命",moon:"5 Pratyak 阻礙"}];const total=4320;const graphic=document.getElementById("threeDayGraphic");const pct=m=>m/total*100;graphic.innerHTML='<p class="three-head">行運月亮｜三日星宿分界 × 雙起算九星宿</p><p class="three-today">2026/11/21–11/23｜台灣 UTC+8｜橫向可滑動</p><div class="three-scroll"><div class="three-canvas"><div class="three-boundary"><div>11/21<span>雙魚座 16°40′（09:19）</span></div><div>11/22<span>白羊座 0°（08:23）</span></div><div>11/23<span>白羊座 13°20′（06:43）</span></div><div>11/24<span>延續 Bharaṇī</span></div></div><div class="three-track">'+trip.map(t=>'<div class="three-part" style="width:'+pct(t.end-t.start)+'%;background:'+t.shade+'">'+t.id+' '+t.sa+'<small>'+t.zh+'</small></div>').join('')+'</div><div class="three-lower">'+[{m:559,label:"11/21 09:19"},{m:1943,label:"11/22 08:23"},{m:3283,label:"11/23 06:43"}].map(t=>'<span class="three-bound" style="left:'+pct(t.m)+'%">'+t.label+'</span>').join('')+'</div><div class="three-nava">'+trip.map(t=>'<span><b>'+t.id+' '+t.sa+'｜'+t.zh+'</b>　上升宿：'+t.asc+'　月宿：'+t.moon+'</span>').join('')+'</div></div></div><p class="three-no-trigger">本圖未放金色⭐：目前沒有完成獨立核實的個人精確觸發。</p><p class="three-legend">星宿中文名稱為辨識用暫譯；上方日期與度數、下方換宿時間分層呈現。星宿換界與精確觸發是不同事件。</p>';const stars={Uttarabhādrapadā:"土星｜Ahirbudhnya：持續、深層整合與承擔",Revatī:"水星｜Pūṣan：引導、護送、完成與過渡",Aśvinī:"計都｜Aśvinī Kumāra：起步、修復與迅速行動",Bharaṇī:"金星｜Yama：界線、承擔與行動代價",Kṛttikā:"太陽｜Agni：篩選、淬鍊與執行標準"};
days.forEach((d,i)=>{const b=document.createElement("button");b.textContent=d.label;b.setAttribute("role","tab");b.setAttribute("aria-selected","false");b.addEventListener("click",()=>show(i));tabs.append(b);
const sec=document.createElement("section");sec.className="day";sec.innerHTML='<h2>'+d.label+'｜'+d.theme+'</h2><article class="card deep"><h3>✦ 星宿深讀｜生活事件與觀察</h3><p>'+d.intro+'</p><p>'+d.almanac+'</p></article><section class="card"><h3>🌙 星宿精讀 × 個人農民曆</h3><p class="note">'+d.five+'</p><p class="clock"></p><div class="buttons"><button type="button" class="live">🌙 返回現在</button><button type="button" class="demo">▶ 示範當日12:00</button></div><div class="bar"></div><div class="ruler"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span></div><div class="timeline"></div><p class="foot">🌙只代表目前時間（或明示的示範時間）。⭐僅用於已核實個人精確觸發；本版沒有核實標記。</p></section>';root.append(sec);const line=sec.querySelector(".timeline"),bar=sec.querySelector(".bar");d.segments.forEach((p,j)=>{const col=["#7293aa","#a188b9"][p[2]===d.segments[0][2]?0:1];const el=document.createElement("section");el.className="segment";el.innerHTML='<span class="when">'+fmt(p[0])+'</span><span class="dot" style="background:'+col+'"></span><strong>'+p[2]+' · '+p[3]+'</strong><p class="location">'+p[4]+'｜'+fmt(p[0])+'–'+fmt(p[1])+'</p><p><b>星相：</b>'+stars[p[2]]+'</p><p><b>A｜事件觀察：</b>'+p[5]+'</p><p class="activity"><b>B｜活動參考：</b>'+p[6]+'</p>';line.append(el);const part=document.createElement("span");part.style.width=(p[1]-p[0])/1440*100+"%";part.style.background=col;part.title=p[2]+" "+p[3];bar.append(part)});const marker=document.createElement("span");marker.className="now";marker.textContent="☾";line.append(marker);sec.querySelector(".live").addEventListener("click",()=>{sec.dataset.demo="";render()});sec.querySelector(".demo").addEventListener("click",()=>{sec.dataset.demo="1";render()})});
function show(i){selected=i;document.querySelectorAll(".day").forEach((e,j)=>e.classList.toggle("active",i===j));document.querySelectorAll("#tabs button").forEach((e,j)=>e.setAttribute("aria-selected",String(i===j)));render()}
function render(){const n=nowTW();document.querySelectorAll(".day").forEach((sec,i)=>{const d=days[i],demo=sec.dataset.demo==="1",valid=demo||n.date===d.date,m=demo?720:n.m;sec.querySelector(".clock").textContent=demo?"示範 "+fmt(m)+"（不是現在）":valid?"現在台灣時間 "+fmt(m):"非當日：不顯示假的現在；可選擇示範";const marker=sec.querySelector(".now"),segments=[...sec.querySelectorAll(".segment")];marker.style.display=valid?"flex":"none";segments.forEach((el,j)=>el.classList.toggle("active",valid&&m>=d.segments[j][0]&&m<d.segments[j][1]));if(valid){const j=d.segments.findIndex(p=>m>=p[0]&&m<p[1]);if(j>=0){const el=segments[j],p=d.segments[j],ratio=(m-p[0])/(p[1]-p[0]);marker.style.top=(el.offsetTop+Math.min(el.offsetHeight-18,Math.max(0,ratio*(el.offsetHeight-18)))-12)+"px"}}})}
const current=nowTW().date;const index=days.findIndex(d=>d.date===current);show(index>=0?index:0);setInterval(render,15000);</script></body></html>
