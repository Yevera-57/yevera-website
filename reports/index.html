
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Yevera｜星宿報告</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#10131b;color:#f4f0e8;
      font-family:system-ui,sans-serif;line-height:1.7}
    main{max-width:760px;margin:auto;padding:24px 18px}
    h1{color:#e8c77f;margin-bottom:0}
    .sub{color:#a9a9b5;margin-top:0}
    .panel{background:#1c202c;border:1px solid #41404b;
      border-radius:16px;padding:18px;margin:18px 0}
    label{display:block;color:#e8c77f;margin:12px 0 5px}
    select{width:100%;padding:12px;background:#10131b;
      color:white;border:1px solid #555;border-radius:9px}
    .item{border-top:1px solid #444;padding:16px 0}
    a{color:#e8c77f}
    img{max-width:100%;height:auto;border-radius:12px}
    .muted{color:#aaa}
  </style>
</head>
<body>
<main>
  <h1>Yevera</h1>
  <p class="sub">Jyotish · Nakshatra · Cosmic Research</p>

  <section class="panel">
    <h2>星宿研究報告</h2>
    <label for="profile">研究對象</label>
    <select id="profile"></select>
    <label for="version">報告版本</label>
    <select id="version"></select>
  </section>

  <section class="panel">
    <h2>已發布內容</h2>
    <div id="results">正在載入資料…</div>
  </section>
  <p><a href="/">返回 Yevera 首頁</a></p>
</main>
<script>
let manifest;
const profile = document.querySelector("#profile");
const version = document.querySelector("#version");
const results = document.querySelector("#results");

function render() {
  const reports = (manifest.reports || []).filter(r =>
    r.profileId === profile.value &&
    r.versionId === version.value
  ).sort((a,b) => String(b.date).localeCompare(String(a.date)));

  results.replaceChildren();
  if (!reports.length) {
    results.textContent = "目前尚無此版本的已發布報告。";
    return;
  }

  for (const r of reports) {
    const item = document.createElement("article");
    item.className = "item";
    const heading = document.createElement("h3");
    heading.textContent = r.title || r.date || "星宿報告";
    item.append(heading);

    if (r.date) {
      const date = document.createElement("p");
      date.className = "muted";
      date.textContent = r.date;
      item.append(date);
    }

    if (r.url && typeof r.url === "string" &&
        (r.url.startsWith("/") && !r.url.startsWith("//"))) {
      const link = document.createElement("a");
      link.href = r.url;
      link.textContent = "閱讀完整報告";
      item.append(link);
    }
    results.append(item);
  }
}

async function init() {
  try {
    const response = await fetch("/data/manifest.json", {
      cache: "no-store"
    });
    if (!response.ok) throw Error("HTTP " + response.status);
    manifest = await response.json();

    for (const p of manifest.profiles || []) {
      if (p.enabled === false) continue;
      profile.add(new Option(p.title, p.id));
    }
    for (const v of manifest.versions || []) {
      version.add(new Option(v.title, v.id));
    }

    profile.addEventListener("change", render);
    version.addEventListener("change", render);
    render();
  } catch (error) {
    results.textContent = "資料載入失敗：" + error.message;
  }
}
init();
</script>
</body>
</html>
