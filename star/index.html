// Copy exactly the currently rendered date article, excluding UI controls.
function copyPublishedDay(section){
 const clone=section.cloneNode(true);
 clone.querySelectorAll("button,.controls,.now").forEach(e=>e.remove());
 const value=clone.innerText.trim();
 if(navigator.clipboard&&navigator.clipboard.writeText){

 }else fallbackCopy(value,section);
}

 const t=document.createElement("textarea");t.value=value;document.body.append(t);t.select();
 const ok=document.execCommand("copy");t.remove();

(function(){
const fresh={"26": {"heading": "11/26｜今日主題：釐清疑問，重新安排工作與生活界線", "reading": "<h3>一、今日星宿與個人農民曆</h3><div class=\"period-head \"><span class=\"hours\">00:00–20:15</span><h3>05 Mṛgaśīrṣa｜觜宿・鹿首宿</h3><div class=\"meta\">金牛23°20′–雙子6°40′｜上升3 Vipat 障礙／月宿5 Pratyak 阻力</div></div><div class=\"period-head green\"><span class=\"hours\">20:15–24:00</span><h3>06 Ārdrā｜參宿・濕潤宿</h3><div class=\"meta\">雙子6°40′–20°｜上升4 Kṣema 安穩／月宿6 Sādhaka 成就</div></div><p class=\"note\">Pada：00:00 Mṛgaśīrṣa P1 → 04:22 Mṛgaśīrṣa P2 → 09:39 Mṛgaśīrṣa P3 → 14:57 Mṛgaśīrṣa P4 → 20:15 Ārdrā P1</p><h3>二、今日星宿精讀</h3><div class=\"period-head \"><span class=\"hours\">00:00–20:15</span><h3>Mṛgaśīrṣa｜把疑問拆成可以確認的問題</h3></div><p>鹿首宿由火星主宿、Soma守護，象徵追尋、探索與對答案的需要。今天前半段延續研究、學習與成果整理，09:39月亮進雙子後，重點轉為日常工作、服務流程、排程和待處理問題。適合把「感覺哪裡不對」整理成具體問題，再逐一找資料或請對方確認。</p><p>上升宿起算3 Vipat障礙，月宿起算5 Pratyak阻力。兩軌在這一段都提醒核對資訊與條件：外在可能需要補資料或改方法，內在則容易因為事情未定而反覆思考。可先分清「確實缺少的資料」與「尚無證據的猜想」，把精力留給能實際修正的部分。</p><p>工作上可觀察研究資料、文件版本、交付標準或同事回覆是否需要澄清。人際與感情則重視對方是否願意回答具體問題、協調時間；不把回覆速度直接當成關係承諾。財務側先核對費用、退款、訂閱或必要支出，避免在資訊不足時增加承擔。</p><div class=\"period-head green\"><span class=\"hours\">20:15–24:00</span><h3>Ārdrā｜把雜訊整理成可採取的行動</h3></div><p>濕潤宿由羅喉主宿、Rudra守護，象徵揭開問題與清理積累。月亮仍在日常工作與問題處理的領域，適合整理今天發現的矛盾、刪掉重複步驟，或把一份含糊訊息改寫成可以回答的清單。</p><p>上升4 Kṣema安穩、月宿6 Sādhaka成就，兩軌轉向穩定與完成。支持表現在事情較能被整理和處理，不代表所有外在條件突然轉好。若需要溝通，先說明想解決的事情和可行選項，讓對方容易回應。</p><p>生活上可安排隔日工作、照顧責任與休息時間。若今天因他人的需要而壓縮了自己的安排，晚間適合重新排優先順序；實際觀察是是否減少一項反覆耗時的問題，而不是要求當天一定出現大事。</p><div class=\"trigger\"><h3>⭐ 11/26 13:27｜月亮對沖本命月亮</h3><p>主要觀察：工作與他人需求，是否擠壓自己的休息、私人時間或原有安排。次要觀察：合作互動需要重新協調節奏。先說清楚能承接的範圍，再確認對方的實際回覆。</p><p class=\"astro\">±5° 11/26 05:31–11/26 21:25；±3° 11/26 08:41–11/26 18:13；±1° 11/26 11:52–11/26 15:03</p></div><p class=\"note\">補充版本：2026/11/26 16:54編製；本日生成前時段為補充回顧，其後為前瞻觀察。原發布版本保留。</p>", "timeline": "<div class=\"seg\" data-start=\"0\" data-end=\"262\"><span class=\"time\">00:00<br><small>A｜星宿</small></span><span class=\"dot\" style=\"background:#8495a5\"></span><strong>Mṛgaśīrṣa P1｜列出今天需要確認的問題</strong><p class=\"note\">觜宿・鹿首宿｜火星／Soma｜外在Vipat 障礙／內在Pratyak 阻力</p><p>列出今天需要確認的問題；依已確認的資料安排下一步。</p></div><div class=\"seg\" data-start=\"262\" data-end=\"579\"><span class=\"time\">04:22<br><small>A｜星宿</small></span><span class=\"dot\" style=\"background:#8495a5\"></span><strong>Mṛgaśīrṣa P2｜核對文件、版本與資料來源</strong><p class=\"note\">觜宿・鹿首宿｜火星／Soma｜外在Vipat 障礙／內在Pratyak 阻力</p><p>核對文件、版本與資料來源；依已確認的資料安排下一步。</p></div><div class=\"seg\" data-start=\"579\" data-end=\"897\"><span class=\"time\">09:39<br><small>A｜星宿</small></span><span class=\"dot\" style=\"background:#8495a5\"></span><strong>Mṛgaśīrṣa P3｜整理工作流程與可承接範圍</strong><p class=\"note\">觜宿・鹿首宿｜火星／Soma｜外在Vipat 障礙／內在Pratyak 阻力</p><p>整理工作流程與可承接範圍；依已確認的資料安排下一步。</p></div><div class=\"seg\" data-start=\"0\" data-end=\"0\"><span class=\"time\">11:52<br><small>B｜±1°</small></span><span class=\"dot\" style=\"background:#d9b86c\"></span><div class=\"precise\"><strong>⭐ 月亮對沖本命月亮</strong><p class=\"astro\">exact 11/26 13:27｜±5° 11/26 05:31–11/26 21:25；±3° 11/26 08:41–11/26 18:13；±1° 11/26 11:52–11/26 15:03</p><p>主要觀察：工作與他人需求，是否擠壓自己的休息、私人時間或原有安排。次要觀察：合作互動需要重新協調節奏。先說清楚能承接的範圍，再確認對方的實際回覆。</p></div></div><div class=\"seg\" data-start=\"897\" data-end=\"1215\"><span class=\"time\">14:57<br><small>A｜星宿</small></span><span class=\"dot\" style=\"background:#8495a5\"></span><strong>Mṛgaśīrṣa P4｜把疑問改成明確的詢問</strong><p class=\"note\">觜宿・鹿首宿｜火星／Soma｜外在Vipat 障礙／內在Pratyak 阻力</p><p>把疑問改成明確的詢問；依已確認的資料安排下一步。</p></div><div class=\"seg\" data-start=\"1215\" data-end=\"1440\"><span class=\"time\">20:15<br><small>A｜星宿</small></span><span class=\"dot\" style=\"background:#8495a5\"></span><strong>Ārdrā P1｜完成一項能減少反覆的修正</strong><p class=\"note\">參宿・濕潤宿｜羅喉／Rudra｜外在Kṣema 安穩／內在Sādhaka 成就</p><p>完成一項能減少反覆的修正；依已確認的資料安排下一步。</p></div>"}, "27": {"heading": "11/27｜今日主題：清理流程，讓成果與負荷保持平衡", "reading": "<h3>一、今日星宿與個人農民曆</h3><div class=\"period-head \"><span class=\"hours\">00:00–17:37</span><h3>06 Ārdrā｜參宿・濕潤宿</h3><div class=\"meta\">雙子6°40′–20°｜上升4 Kṣema 安穩／月宿6 Sādhaka 成就</div></div><div class=\"period-head green\"><span class=\"hours\">17:37–24:00</span><h3>07 Punarvasu｜井宿・再生宿</h3><div class=\"meta\">雙子20°–巨蟹3°20′｜上升5 Pratyak 阻力／月宿7 Naidhana 考驗</div></div><p class=\"note\">Pada：00:00 Ārdrā P1 → 01:34 Ārdrā P2 → 06:54 Ārdrā P3 → 12:15 Ārdrā P4 → 17:37 Punarvasu P1 → 23:00 Punarvasu P2</p><h3>二、今日星宿精讀</h3><div class=\"period-head \"><span class=\"hours\">00:00–17:37</span><h3>Ārdrā｜清理流程，讓責任回到明確範圍</h3></div><p>Ārdrā的Rudra意象延續清理與重整。今天大部分時段月亮位於雙子，工作方法、服務需求、文件以及日常排程是可觀察焦點。比起同時回覆很多零碎要求，更適合選一個最影響進度的環節，先把它處理清楚。</p><p>上升Kṣema安穩、月宿Sādhaka成就同向。外在可以建立較穩定的做法，內在則希望看到實際完成。若有人願意協助，明確交代要確認哪個版本、何時回覆、完成標準為何，才能把支持轉為進度。</p><p>可能情境包括修改資料整理方法、釐清主管或同事的要求、重排工作與私人時間，或修正先前反覆出錯的步驟。感情互動可直接提出時間與需求，觀察雙方能否落實一項小安排，不以單次訊息推定長期關係。</p><div class=\"period-head green\"><span class=\"hours\">17:37–24:00</span><h3>Punarvasu｜重新接回方案，也檢查自己的負荷</h3></div><p>再生宿由木星主宿、Aditi守護，象徵恢復、重新接納與調整後再開始。白天整理過的內容，可以轉成更精簡的計畫；舊議題重新出現時，先確認這次是否多了資料或可用條件，再決定是否重啟。</p><p>上升5 Pratyak阻力、月宿7 Naidhana考驗：外在需核對程序、審批或協商條件，內在則需檢查代價、界線與負荷。這段先問「哪些條件還沒確定，自己又能承擔到哪裡」，再安排下一步。</p><p>可觀察是否需要縮小研究範圍、重新談交付期限，或對人際邀請提出更合適的時間。財務先看完成這件事還要投入多少時間與費用；若沒有新增實際資源，保留可退可調整的空間。</p><p class=\"note\">補充版本：2026/11/26 16:54編製；本日生成前時段為補充回顧，其後為前瞻觀察。原發布版本保留。</p>", "timeline": "<div class=\"seg\" data-start=\"0\" data-end=\"94\"><span class=\"time\">00:00<br><small>A｜星宿</small></span><span class=\"dot\" style=\"background:#8495a5\"></span><strong>Ārdrā P1｜保留能維持的工作節奏</strong><p class=\"note\">參宿・濕潤宿｜羅喉／Rudra｜外在Kṣema 安穩／內在Sādhaka 成就</p><p>保留能維持的工作節奏；依已確認的資料安排下一步。</p></div><div class=\"seg\" data-start=\"94\" data-end=\"414\"><span class=\"time\">01:34<br><small>A｜星宿</small></span><span class=\"dot\" style=\"background:#8495a5\"></span><strong>Ārdrā P2｜確認哪些要求需要補充資料</strong><p class=\"note\">參宿・濕潤宿｜羅喉／Rudra｜外在Kṣema 安穩／內在Sādhaka 成就</p><p>確認哪些要求需要補充資料；依已確認的資料安排下一步。</p></div><div class=\"seg\" data-start=\"414\" data-end=\"735\"><span class=\"time\">06:54<br><small>A｜星宿</small></span><span class=\"dot\" style=\"background:#8495a5\"></span><strong>Ārdrā P3｜先完成影響進度的關鍵步驟</strong><p class=\"note\">參宿・濕潤宿｜羅喉／Rudra｜外在Kṣema 安穩／內在Sādhaka 成就</p><p>先完成影響進度的關鍵步驟；依已確認的資料安排下一步。</p></div><div class=\"seg\" data-start=\"735\" data-end=\"1057\"><span class=\"time\">12:15<br><small>A｜星宿</small></span><span class=\"dot\" style=\"background:#8495a5\"></span><strong>Ārdrā P4｜整理修改版本與責任界線</strong><p class=\"note\">參宿・濕潤宿｜羅喉／Rudra｜外在Kṣema 安穩／內在Sādhaka 成就</p><p>整理修改版本與責任界線；依已確認的資料安排下一步。</p></div><div class=\"seg\" data-start=\"1057\" data-end=\"1380\"><span class=\"time\">17:37<br><small>A｜星宿</small></span><span class=\"dot\" style=\"background:#8495a5\"></span><strong>Punarvasu P1｜重新接回可行方案</strong><p class=\"note\">井宿・再生宿｜木星／Aditi｜外在Pratyak 阻力／內在Naidhana 考驗</p><p>重新接回可行方案；依已確認的資料安排下一步。</p></div><div class=\"seg\" data-start=\"1380\" data-end=\"1440\"><span class=\"time\">23:00<br><small>A｜星宿</small></span><span class=\"dot\" style=\"background:#8495a5\"></span><strong>Punarvasu P2｜檢查承諾與個人負荷</strong><p class=\"note\">井宿・再生宿｜木星／Aditi｜外在Pratyak 阻力／內在Naidhana 考驗</p><p>檢查承諾與個人負荷；依已確認的資料安排下一步。</p></div><p class=\"note\">本日掃描範圍內，沒有新核實的月亮合／沖本命主要星曜或上升點精確接觸，B軌不另設金色事件。</p>"}, "28": {"heading": "11/28｜今日主題：從處理工作，走向一對一合作與需求確認", "reading": "<h3>一、今日星宿與個人農民曆</h3><div class=\"period-head \"><span class=\"hours\">00:00–15:18</span><h3>07 Punarvasu｜井宿・再生宿</h3><div class=\"meta\">雙子20°–巨蟹3°20′｜上升5 Pratyak 阻力／月宿7 Naidhana 考驗</div></div><div class=\"period-head green\"><span class=\"hours\">15:18–24:00</span><h3>08 Puṣya｜鬼宿・滋養宿</h3><div class=\"meta\">巨蟹3°20′–16°40′｜上升6 Sādhaka 成就／月宿8 Mitra 友好</div></div><p class=\"note\">Pada：00:00 Punarvasu P2 → 04:25 Punarvasu P3 → 09:51 Punarvasu P4 → 15:18 Puṣya P1 → 20:48 Puṣya P2</p><h3>二、今日星宿精讀</h3><div class=\"period-head \"><span class=\"hours\">00:00–15:18</span><h3>Punarvasu｜把自己的能力與對方的需求接起來</h3></div><p>Punarvasu延續修復與重新整合。09:51以前月亮仍在日常工作、責任與問題處理的領域，適合整理未完事項；之後進巨蟹，焦點轉向一對一互動、合作條件和對方的需要。內在想到的方案，需要經過實際對話才知道是否適合雙方。</p><p>上升Pratyak阻力、月宿Naidhana考驗，提醒先檢查程序、承諾與成本。可以主動提出可做到的範圍，也容許對方有不同安排；若需要等待回覆，就把等待與已確認的決定分開記錄。</p><p>工作合作可觀察對方是否提出時間、範圍或責任的具體要求；感情人際則觀察是否能協調一項實際安排，而非只靠心裡推測。上午到下午的變化，是從自己整理問題走向與對方確認條件。</p><div class=\"period-head green\"><span class=\"hours\">15:18–24:00</span><h3>Puṣya｜讓互相支持有穩定的方式</h3></div><p>滋養宿由土星主宿、Bṛhaspati守護，象徵供養、維護與有秩序的支持。月亮進入一對一互動領域後，適合把幫忙、照顧與合作落到可持續的安排，例如彼此可投入的時間、固定聯繫方式或責任分工。</p><p>上升6 Sādhaka成就、月宿8 Mitra友好：外在適合把合作落到可完成的安排，內在較願意交流與協助。把可提供的時間和需要對方配合的部分說清楚，能讓友好轉為實際支持；仍以雙方行動確認成果。</p><p>可觀察是否有人提出合作、求助、邀約或需要你明確回覆。若尚無外部事件，也可將這段用於整理自己的界線與下一週安排。關係進展以雙方實際行動為準，不把星宿或單次接觸直接判成承諾。</p><div class=\"trigger\"><h3>⭐ 11/28 15:18｜月亮對沖本命上升點</h3><p>觀察自己的安排與對方的需求如何協調；可能涉及合作、邀約、求助或需要本人回覆的事項。這是獨立的本命軸線接觸，不把同分鐘的換宿當成同一種觸發。</p><p class=\"astro\">±5° 11/28 07:07–11/28 23:33；±3° 11/28 10:23–11/28 20:14；±1° 11/28 13:39–11/28 16:57</p></div><p class=\"note\">補充版本：2026/11/26 16:54編製；本日生成前時段為補充回顧，其後為前瞻觀察。原發布版本保留。</p>", "timeline": "<div class=\"seg\" data-start=\"0\" data-end=\"265\"><span class=\"time\">00:00<br><small>A｜星宿</small></span><span class=\"dot\" style=\"background:#8495a5\"></span><strong>Punarvasu P2｜整理未完成的工作與問題</strong><p class=\"note\">井宿・再生宿｜木星／Aditi｜外在Pratyak 阻力／內在Naidhana 考驗</p><p>整理未完成的工作與問題；依已確認的資料安排下一步。</p></div><div class=\"seg\" data-start=\"265\" data-end=\"591\"><span class=\"time\">04:25<br><small>A｜星宿</small></span><span class=\"dot\" style=\"background:#8495a5\"></span><strong>Punarvasu P3｜核對方法及所需資源</strong><p class=\"note\">井宿・再生宿｜木星／Aditi｜外在Pratyak 阻力／內在Naidhana 考驗</p><p>核對方法及所需資源；依已確認的資料安排下一步。</p></div><div class=\"seg\" data-start=\"591\" data-end=\"918\"><span class=\"time\">09:51<br><small>A｜星宿</small></span><span class=\"dot\" style=\"background:#8495a5\"></span><strong>Punarvasu P4｜轉向對方需求與合作安排</strong><p class=\"note\">井宿・再生宿｜木星／Aditi｜外在Pratyak 阻力／內在Naidhana 考驗</p><p>轉向對方需求與合作安排；依已確認的資料安排下一步。</p></div><div class=\"seg\" data-start=\"0\" data-end=\"0\"><span class=\"time\">13:39<br><small>B｜±1°</small></span><span class=\"dot\" style=\"background:#d9b86c\"></span><div class=\"precise\"><strong>⭐ 月亮對沖本命上升點</strong><p class=\"astro\">exact 11/28 15:18｜±5° 11/28 07:07–11/28 23:33；±3° 11/28 10:23–11/28 20:14；±1° 11/28 13:39–11/28 16:57</p><p>觀察自己的安排與對方的需求如何協調；可能涉及合作、邀約、求助或需要本人回覆的事項。這是獨立的本命軸線接觸，不把同分鐘的換宿當成同一種觸發。</p></div></div><div class=\"seg\" data-start=\"918\" data-end=\"1248\"><span class=\"time\">15:18<br><small>A｜星宿</small></span><span class=\"dot\" style=\"background:#8495a5\"></span><strong>Puṣya P1｜確認互相支持的具體方式</strong><p class=\"note\">鬼宿・滋養宿｜土星／Bṛhaspati｜外在Sādhaka 成就／內在Mitra 友好</p><p>確認互相支持的具體方式；依已確認的資料安排下一步。</p></div><div class=\"seg\" data-start=\"1248\" data-end=\"1440\"><span class=\"time\">20:48<br><small>A｜星宿</small></span><span class=\"dot\" style=\"background:#8495a5\"></span><strong>Puṣya P2｜把邀約與承諾落到可行範圍</strong><p class=\"note\">鬼宿・滋養宿｜土星／Bṛhaspati｜外在Sādhaka 成就／內在Mitra 友好</p><p>把邀約與承諾落到可行範圍；依已確認的資料安排下一步。</p></div>"}},officialCopy={"2026-11-26": "11/26｜今日主題：釐清疑問，重新安排工作與生活界線\n一、今日星宿與個人農民曆\n00:00–20:1505 Mṛgaśīrṣa｜觜宿・鹿首宿\n金牛23°20′–雙子6°40′｜上升3 Vipat 障礙／月宿5 Pratyak 阻力\n\n20:15–24:0006 Ārdrā｜參宿・濕潤宿\n雙子6°40′–20°｜上升4 Kṣema 安穩／月宿6 Sādhaka 成就\n\nPada：00:00 Mṛgaśīrṣa P1 → 04:22 Mṛgaśīrṣa P2 → 09:39 Mṛgaśīrṣa P3 → 14:57 Mṛgaśīrṣa P4 → 20:15 Ārdrā P1\n二、今日星宿精讀\n00:00–20:15Mṛgaśīrṣa｜把疑問拆成可以確認的問題\n\n鹿首宿由火星主宿、Soma守護，象徵追尋、探索與對答案的需要。今天前半段延續研究、學習與成果整理，09:39月亮進雙子後，重點轉為日常工作、服務流程、排程和待處理問題。適合把「感覺哪裡不對」整理成具體問題，再逐一找資料或請對方確認。\n上升宿起算3 Vipat障礙，月宿起算5 Pratyak阻力。兩軌在這一段都提醒核對資訊與條件：外在可能需要補資料或改方法，內在則容易因為事情未定而反覆思考。可先分清「確實缺少的資料」與「尚無證據的猜想」，把精力留給能實際修正的部分。\n工作上可觀察研究資料、文件版本、交付標準或同事回覆是否需要澄清。人際與感情則重視對方是否願意回答具體問題、協調時間；不把回覆速度直接當成關係承諾。財務側先核對費用、退款、訂閱或必要支出，避免在資訊不足時增加承擔。\n20:15–24:00Ārdrā｜把雜訊整理成可採取的行動\n\n濕潤宿由羅喉主宿、Rudra守護，象徵揭開問題與清理積累。月亮仍在日常工作與問題處理的領域，適合整理今天發現的矛盾、刪掉重複步驟，或把一份含糊訊息改寫成可以回答的清單。\n上升4 Kṣema安穩、月宿6 Sādhaka成就，兩軌轉向穩定與完成。支持表現在事情較能被整理和處理，不代表所有外在條件突然轉好。若需要溝通，先說明想解決的事情和可行選項，讓對方容易回應。\n生活上可安排隔日工作、照顧責任與休息時間。若今天因他人的需要而壓縮了自己的安排，晚間適合重新排優先順序；實際觀察是是否減少一項反覆耗時的問題，而不是要求當天一定出現大事。\n⭐ 11/26 13:27｜月亮對沖本命月亮\n主要觀察：工作與他人需求，是否擠壓自己的休息、私人時間或原有安排。次要觀察：合作互動需要重新協調節奏。先說清楚能承接的範圍，再確認對方的實際回覆。\n±5° 11/26 05:31–11/26 21:25；±3° 11/26 08:41–11/26 18:13；±1° 11/26 11:52–11/26 15:03\n\n補充版本：2026/11/26 16:54編製；本日生成前時段為補充回顧，其後為前瞻觀察。原發布版本保留。\n三、今日時段與具體建議｜A/B雙軌\n00:00\nA｜星宿Mṛgaśīrṣa P1｜列出今天需要確認的問題觜宿・鹿首宿｜火星／Soma｜外在Vipat 障礙／內在Pratyak 阻力\n列出今天需要確認的問題；依已確認的資料安排下一步。\n\n04:22\nA｜星宿Mṛgaśīrṣa P2｜核對文件、版本與資料來源觜宿・鹿首宿｜火星／Soma｜外在Vipat 障礙／內在Pratyak 阻力\n核對文件、版本與資料來源；依已確認的資料安排下一步。\n\n09:39\nA｜星宿Mṛgaśīrṣa P3｜整理工作流程與可承接範圍觜宿・鹿首宿｜火星／Soma｜外在Vipat 障礙／內在Pratyak 阻力\n整理工作流程與可承接範圍；依已確認的資料安排下一步。\n\n11:52\nB｜±1°⭐ 月亮對沖本命月亮exact 11/26 13:27｜±5° 11/26 05:31–11/26 21:25；±3° 11/26 08:41–11/26 18:13；±1° 11/26 11:52–11/26 15:03\n主要觀察：工作與他人需求，是否擠壓自己的休息、私人時間或原有安排。次要觀察：合作互動需要重新協調節奏。先說清楚能承接的範圍，再確認對方的實際回覆。\n\n\n14:57\nA｜星宿Mṛgaśīrṣa P4｜把疑問改成明確的詢問觜宿・鹿首宿｜火星／Soma｜外在Vipat 障礙／內在Pratyak 阻力\n把疑問改成明確的詢問；依已確認的資料安排下一步。\n\n20:15\nA｜星宿Ārdrā P1｜完成一項能減少反覆的修正參宿・濕潤宿｜羅喉／Rudra｜外在Kṣema 安穩／內在Sādhaka 成就\n完成一項能減少反覆的修正；依已確認的資料安排下一步。", "2026-11-27": "11/27｜今日主題：清理流程，讓成果與負荷保持平衡\n一、今日星宿與個人農民曆\n00:00–17:3706 Ārdrā｜參宿・濕潤宿\n雙子6°40′–20°｜上升4 Kṣema 安穩／月宿6 Sādhaka 成就\n\n17:37–24:0007 Punarvasu｜井宿・再生宿\n雙子20°–巨蟹3°20′｜上升5 Pratyak 阻力／月宿7 Naidhana 考驗\n\nPada：00:00 Ārdrā P1 → 01:34 Ārdrā P2 → 06:54 Ārdrā P3 → 12:15 Ārdrā P4 → 17:37 Punarvasu P1 → 23:00 Punarvasu P2\n二、今日星宿精讀\n00:00–17:37Ārdrā｜清理流程，讓責任回到明確範圍\n\nĀrdrā的Rudra意象延續清理與重整。今天大部分時段月亮位於雙子，工作方法、服務需求、文件以及日常排程是可觀察焦點。比起同時回覆很多零碎要求，更適合選一個最影響進度的環節，先把它處理清楚。\n上升Kṣema安穩、月宿Sādhaka成就同向。外在可以建立較穩定的做法，內在則希望看到實際完成。若有人願意協助，明確交代要確認哪個版本、何時回覆、完成標準為何，才能把支持轉為進度。\n可能情境包括修改資料整理方法、釐清主管或同事的要求、重排工作與私人時間，或修正先前反覆出錯的步驟。感情互動可直接提出時間與需求，觀察雙方能否落實一項小安排，不以單次訊息推定長期關係。\n17:37–24:00Punarvasu｜重新接回方案，也檢查自己的負荷\n\n再生宿由木星主宿、Aditi守護，象徵恢復、重新接納與調整後再開始。白天整理過的內容，可以轉成更精簡的計畫；舊議題重新出現時，先確認這次是否多了資料或可用條件，再決定是否重啟。\n上升5 Pratyak阻力、月宿7 Naidhana考驗：外在需核對程序、審批或協商條件，內在則需檢查代價、界線與負荷。這段先問「哪些條件還沒確定，自己又能承擔到哪裡」，再安排下一步。\n可觀察是否需要縮小研究範圍、重新談交付期限，或對人際邀請提出更合適的時間。財務先看完成這件事還要投入多少時間與費用；若沒有新增實際資源，保留可退可調整的空間。\n補充版本：2026/11/26 16:54編製；本日生成前時段為補充回顧，其後為前瞻觀察。原發布版本保留。\n三、今日時段與具體建議｜A/B雙軌\n00:00\nA｜星宿Ārdrā P1｜保留能維持的工作節奏參宿・濕潤宿｜羅喉／Rudra｜外在Kṣema 安穩／內在Sādhaka 成就\n保留能維持的工作節奏；依已確認的資料安排下一步。\n\n01:34\nA｜星宿Ārdrā P2｜確認哪些要求需要補充資料參宿・濕潤宿｜羅喉／Rudra｜外在Kṣema 安穩／內在Sādhaka 成就\n確認哪些要求需要補充資料；依已確認的資料安排下一步。\n\n06:54\nA｜星宿Ārdrā P3｜先完成影響進度的關鍵步驟參宿・濕潤宿｜羅喉／Rudra｜外在Kṣema 安穩／內在Sādhaka 成就\n先完成影響進度的關鍵步驟；依已確認的資料安排下一步。\n\n12:15\nA｜星宿Ārdrā P4｜整理修改版本與責任界線參宿・濕潤宿｜羅喉／Rudra｜外在Kṣema 安穩／內在Sādhaka 成就\n整理修改版本與責任界線；依已確認的資料安排下一步。\n\n17:37\nA｜星宿Punarvasu P1｜重新接回可行方案井宿・再生宿｜木星／Aditi｜外在Pratyak 阻力／內在Naidhana 考驗\n重新接回可行方案；依已確認的資料安排下一步。\n\n23:00\nA｜星宿Punarvasu P2｜檢查承諾與個人負荷井宿・再生宿｜木星／Aditi｜外在Pratyak 阻力／內在Naidhana 考驗\n檢查承諾與個人負荷；依已確認的資料安排下一步。\n\n本日掃描範圍內，沒有新核實的月亮合／沖本命主要星曜或上升點精確接觸，B軌不另設金色事件。", "2026-11-28": "11/28｜今日主題：從處理工作，走向一對一合作與需求確認\n一、今日星宿與個人農民曆\n00:00–15:1807 Punarvasu｜井宿・再生宿\n雙子20°–巨蟹3°20′｜上升5 Pratyak 阻力／月宿7 Naidhana 考驗\n\n15:18–24:0008 Puṣya｜鬼宿・滋養宿\n巨蟹3°20′–16°40′｜上升6 Sādhaka 成就／月宿8 Mitra 友好\n\nPada：00:00 Punarvasu P2 → 04:25 Punarvasu P3 → 09:51 Punarvasu P4 → 15:18 Puṣya P1 → 20:48 Puṣya P2\n二、今日星宿精讀\n00:00–15:18Punarvasu｜把自己的能力與對方的需求接起來\n\nPunarvasu延續修復與重新整合。09:51以前月亮仍在日常工作、責任與問題處理的領域，適合整理未完事項；之後進巨蟹，焦點轉向一對一互動、合作條件和對方的需要。內在想到的方案，需要經過實際對話才知道是否適合雙方。\n上升Pratyak阻力、月宿Naidhana考驗，提醒先檢查程序、承諾與成本。可以主動提出可做到的範圍，也容許對方有不同安排；若需要等待回覆，就把等待與已確認的決定分開記錄。\n工作合作可觀察對方是否提出時間、範圍或責任的具體要求；感情人際則觀察是否能協調一項實際安排，而非只靠心裡推測。上午到下午的變化，是從自己整理問題走向與對方確認條件。\n15:18–24:00Puṣya｜讓互相支持有穩定的方式\n\n滋養宿由土星主宿、Bṛhaspati守護，象徵供養、維護與有秩序的支持。月亮進入一對一互動領域後，適合把幫忙、照顧與合作落到可持續的安排，例如彼此可投入的時間、固定聯繫方式或責任分工。\n上升6 Sādhaka成就、月宿8 Mitra友好：外在適合把合作落到可完成的安排，內在較願意交流與協助。把可提供的時間和需要對方配合的部分說清楚，能讓友好轉為實際支持；仍以雙方行動確認成果。\n可觀察是否有人提出合作、求助、邀約或需要你明確回覆。若尚無外部事件，也可將這段用於整理自己的界線與下一週安排。關係進展以雙方實際行動為準，不把星宿或單次接觸直接判成承諾。\n⭐ 11/28 15:18｜月亮對沖本命上升點\n觀察自己的安排與對方的需求如何協調；可能涉及合作、邀約、求助或需要本人回覆的事項。這是獨立的本命軸線接觸，不把同分鐘的換宿當成同一種觸發。\n±5° 11/28 07:07–11/28 23:33；±3° 11/28 10:23–11/28 20:14；±1° 11/28 13:39–11/28 16:57\n\n補充版本：2026/11/26 16:54編製；本日生成前時段為補充回顧，其後為前瞻觀察。原發布版本保留。\n三、今日時段與具體建議｜A/B雙軌\n00:00\nA｜星宿Punarvasu P2｜整理未完成的工作與問題井宿・再生宿｜木星／Aditi｜外在Pratyak 阻力／內在Naidhana 考驗\n整理未完成的工作與問題；依已確認的資料安排下一步。\n\n04:25\nA｜星宿Punarvasu P3｜核對方法及所需資源井宿・再生宿｜木星／Aditi｜外在Pratyak 阻力／內在Naidhana 考驗\n核對方法及所需資源；依已確認的資料安排下一步。\n\n09:51\nA｜星宿Punarvasu P4｜轉向對方需求與合作安排井宿・再生宿｜木星／Aditi｜外在Pratyak 阻力／內在Naidhana 考驗\n轉向對方需求與合作安排；依已確認的資料安排下一步。\n\n13:39\nB｜±1°⭐ 月亮對沖本命上升點exact 11/28 15:18｜±5° 11/28 07:07–11/28 23:33；±3° 11/28 10:23–11/28 20:14；±1° 11/28 13:39–11/28 16:57\n觀察自己的安排與對方的需求如何協調；可能涉及合作、邀約、求助或需要本人回覆的事項。這是獨立的本命軸線接觸，不把同分鐘的換宿當成同一種觸發。\n\n\n15:18\nA｜星宿Puṣya P1｜確認互相支持的具體方式鬼宿・滋養宿｜土星／Bṛhaspati｜外在Sādhaka 成就／內在Mitra 友好\n確認互相支持的具體方式；依已確認的資料安排下一步。\n\n20:48\nA｜星宿Puṣya P2｜把邀約與承諾落到可行範圍鬼宿・滋養宿｜土星／Bṛhaspati｜外在Sādhaka 成就／內在Mitra 友好\n把邀約與承諾落到可行範圍；依已確認的資料安排下一步。"};

function weekNow(){document.querySelectorAll('.week-now').forEach(e=>e.remove());const n=nowTW();if(n.date>='2026-11-22'&&n.date<='2026-11-28'){const e=document.createElement('span');e.className='week-now';e.textContent='🌙';e.style.cssText='position:absolute;z-index:9;top:0;transform:translateX(-50%);left:'+((Number(n.date.slice(-2))-22)*1440+n.minute)/10080*100+'%';document.querySelector('#graph .bar').append(e)}}
const added=[{"m": 6567.184652164578, "label": "月亮對沖本命月亮", "time": "11/26 13:27"}, {"m": 9557.948705032468, "label": "月亮對沖本命上升點", "time": "11/28 15:18"}];for(const x of added){if(x.label==='月亮對沖本命月亮')continue;const e=document.createElement('div');e.className='astro-mark personal';e.textContent='⭐ '+x.time+' '+x.label;e.style.left=x.m/10080*100+'%';document.querySelector('#graph .bar').append(e)}
let today=nowTW().date;const now=nowTW();select(now.date.startsWith('2026-11-')&&Number(now.date.slice(-2))>=22&&Number(now.date.slice(-2))<=28?Number(now.date.slice(-2))-22:4);weekNow();setInterval(()=>{let n=nowTW();if(n.date!==today){today=n.date;if(n.date>='2026-11-22'&&n.date<='2026-11-28')select(Number(n.date.slice(-2))-22)}weekNow()},20000);
})();
</script></body></html>
